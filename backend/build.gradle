plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.5'
	id 'io.spring.dependency-management' version '1.1.6'
}

ext {
	springCloudVersion = "2023.0.3"
}

group = 'org.venow'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-mysql'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:mysql'
	testImplementation 'org.springframework.cloud:spring-cloud-starter-contract-stub-runner'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'com.h2database:h2'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.assertj:assertj-core:3.24.2'

}
tasks.withType(Copy) {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}


dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:$springCloudVersion"
	}
}

configurations {
	honeycombImplementation {
		canBeResolved = true
		extendsFrom testImplementation
	}
	honeycombRuntimeOnly {
		canBeResolved = true
		extendsFrom testRuntimeOnly
		extendsFrom testRuntimeOnly
	}
	testpyramidImplementation {
		canBeResolved = true
		extendsFrom testImplementation
	}
	testpyramidRuntimeOnly {
		canBeResolved = true
		extendsFrom testRuntimeOnly
	}
}

sourceSets {
	honeycomb {
			java.srcDir 'src/honeycomb/java'
			resources.srcDir 'src/honeycomb/resources'

		compileClasspath += sourceSets.main.output
		runtimeClasspath += sourceSets.main.output
	}

	testpyramid {
		java.srcDir 'src/testpyramid/java'
		resources.srcDir 'src/testpyramid/resources'

		compileClasspath += sourceSets.main.output
		runtimeClasspath += sourceSets.main.output
	}
}

task honeycombTest(type: Test) {
	group = 'verification'
	description = 'Run Honeycomb model integration tests'
	testClassesDirs = sourceSets.honeycomb.output.classesDirs
	classpath = sourceSets.honeycomb.runtimeClasspath
	useJUnitPlatform()
}

task testPyramidTest(type: Test) {
	group = 'verification'
	description = 'Run Test Pyramid unit tests'
	testClassesDirs = sourceSets.testpyramid.output.classesDirs
	classpath = sourceSets.testpyramid.runtimeClasspath
	useJUnitPlatform()
}

tasks.named('check') {
	dependsOn 'honeycombTest', 'testPyramidTest'
}

tasks.named('test') {
	useJUnitPlatform()
}
