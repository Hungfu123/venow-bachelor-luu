plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.5'
	id 'io.spring.dependency-management' version '1.1.6'
	id 'jacoco'
	id 'info.solidsoft.pitest' version '1.15.0'

}

ext {
	springCloudVersion = "2023.0.3"
}

jacoco {
	toolVersion = "0.8.10"
}
group = 'org.venow'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-mysql'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:mysql'
	testImplementation 'org.springframework.cloud:spring-cloud-starter-contract-stub-runner'
	testImplementation 'org.springframework.security:spring-security-test'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'com.h2database:h2'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.assertj:assertj-core:3.24.2'
	implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	implementation 'info.solidsoft.gradle.pitest:gradle-pitest-plugin:1.15.0'

}
tasks.withType(Copy) {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}


dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:$springCloudVersion"
	}
}

configurations {
	honeycombImplementation {
		canBeResolved = true
		extendsFrom testImplementation
	}
	honeycombRuntimeOnly {
		canBeResolved = true
		extendsFrom testRuntimeOnly
		extendsFrom testRuntimeOnly
	}
	testpyramidImplementation {
		canBeResolved = true
		extendsFrom testImplementation
	}
	testpyramidRuntimeOnly {
		canBeResolved = true
		extendsFrom testRuntimeOnly
	}
}

sourceSets {
	honeycomb {
			java.srcDir 'src/honeycomb/java'
			resources.srcDir 'src/honeycomb/resources'

		compileClasspath += sourceSets.main.output
		runtimeClasspath += sourceSets.main.output
	}

	testpyramid {
		java.srcDir 'src/testpyramid/java'
		resources.srcDir 'src/testpyramid/resources'

		compileClasspath += sourceSets.main.output
		runtimeClasspath += sourceSets.main.output
	}
}

task honeycombTest(type: Test) {
	group = 'verification'
	description = 'Run Honeycomb model integration tests'
	testClassesDirs = sourceSets.honeycomb.output.classesDirs
	classpath = sourceSets.honeycomb.runtimeClasspath
	useJUnitPlatform()
}

task testPyramidTest(type: Test) {
	group = 'verification'
	description = 'Run Test Pyramid unit tests'
	testClassesDirs = sourceSets.testpyramid.output.classesDirs
	classpath = sourceSets.testpyramid.runtimeClasspath
	useJUnitPlatform()
}

tasks.named('check') {
	dependsOn 'honeycombTest', 'testPyramidTest' // JUnit Tests
	dependsOn 'jacocoTestPyramidReport', 'jacocoHoneycombReport' // JaCoCo Coverage Reports
	dependsOn 'pitest', 'pitestHoneycomb' // Mutation Testing (PIT)
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.register("jacocoHoneycombReport", JacocoReport) {
	dependsOn honeycombTest // Task für Honeycomb-Tests

	executionData.setFrom(fileTree(buildDir).include("jacoco/honeycombTest.exec"))

	sourceDirectories.setFrom(sourceSets.main.allSource.srcDirs)
	classDirectories.setFrom(sourceSets.main.output)
	additionalSourceDirs.setFrom(sourceSets.honeycomb.allSource.srcDirs)

	reports {
		html.required.set(true)
		xml.required.set(true)
		csv.required.set(false)
		html.outputLocation.set(layout.buildDirectory.dir("reports/jacoco/honeycomb"))
	}
}

tasks.register("jacocoTestPyramidReport", JacocoReport) {
	dependsOn testPyramidTest // Task für Test Pyramid-Tests

	executionData.setFrom(fileTree(buildDir).include("jacoco/testPyramidTest.exec"))

	sourceDirectories.setFrom(sourceSets.main.allSource.srcDirs)
	classDirectories.setFrom(sourceSets.main.output)
	additionalSourceDirs.setFrom(sourceSets.testpyramid.allSource.srcDirs)

	reports {
		html.required.set(true)
		xml.required.set(true)
		csv.required.set(false)
		html.outputLocation.set(layout.buildDirectory.dir("reports/jacoco/testpyramid"))
	}
}

pitest {
	targetClasses = ['org.venow.backend.*']
	targetTests = ['org.venow.backend.*']
//	timeoutConstInMillis = 30000
	features = ['+auto_threads']
	testSourceSets = [sourceSets.testpyramid]
	junit5PluginVersion = '1.2.1'
	mainSourceSets = [sourceSets.main]
	verbose = true
	threads = 6
	def testSourceSetName = project.hasProperty("testSourceSet") ? project.getProperty("testSourceSet") : "testpyramid"
	testSourceSets = [sourceSets[testSourceSetName]]
	reportDir.set(layout.buildDirectory.dir("reports/pitest/${testSourceSetName}"))

	outputFormats = ['HTML', 'XML', 'CSV']
	exportLineCoverage = true
}

tasks.register("pitestHoneycomb") {
	group = "verification"
	description = "Run PIT mutation tests for Honeycomb strategy"

	doLast {
		def gradleExecutable = System.getProperty("os.name").toLowerCase().contains("win") ? "gradlew.bat" : "./gradlew"

		exec {
			executable = gradleExecutable
			args = ["pitest", "-PtestSourceSet=honeycomb"]
		}
	}
}
